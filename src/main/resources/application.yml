spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/whatsapp_bot_db
    username: bot_user
    password: bot_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jdbc:
    time_zone: Asia/Kolkata

  jackson:
    time-zone: Asia/Kolkata

server:
  port: 8080